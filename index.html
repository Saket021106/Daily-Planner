<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101426"><title>Brighter Days · Daily Planner</title>
<style>
:root{color-scheme:dark;--bg:#101426;--panel:#191d33;--line:#2c3354;--coral:#f4957d;--mint:#7dd3b0;--lav:#b7a6ff;--text:#f5f5ff;--muted:#9ca6c8}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.sidebar{position:fixed;width:260px;inset:0 auto 0 0;background:#15192d;border-right:1px solid var(--line);padding:31px 18px;z-index:4}.brand{font-size:21px;font-weight:800;letter-spacing:-.7px}.brand span{color:var(--coral)}.tagline{font-size:13px;color:var(--muted);margin:7px 8px 32px}.sidebar nav{display:grid;gap:7px}.sidebar nav button{display:flex;gap:13px;align-items:center;border:0;background:none;color:#b8c0dc;border-radius:10px;padding:12px;width:100%;font-size:14px;text-align:left}.sidebar nav button.active,.sidebar nav button:hover{background:#292e4d;color:white}.local{position:absolute;bottom:28px;display:grid;grid-template-columns:20px auto;gap:5px;color:var(--lav);font-size:12px;padding:12px}.local small{grid-column:2;color:var(--muted);font-size:10px}.content{margin-left:260px;max-width:1500px;padding:30px 5vw 60px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.eyebrow{letter-spacing:1.4px;font-size:10px;color:var(--lav);font-weight:700;margin:0 0 7px}h1{font-size:30px;margin:0;letter-spacing:-1px}h2{font-size:24px;margin:0 0 10px;letter-spacing:-.7px}h3{margin:0;font-size:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.hero{background:linear-gradient(135deg,#29284b,#1e3150);grid-column:span 2;padding:33px}.hero h2{font-size:30px}.primary{background:var(--coral);color:#201724;border:0;border-radius:9px;padding:11px 14px;font-weight:750;display:inline-flex;gap:6px;align-items:center;margin-top:12px}.quiet,.carryrow button,.tabs button{border:1px solid #414966;background:transparent;color:#cbd2eb;border-radius:8px;padding:8px 10px}.big{font-size:38px;line-height:1}.big span{font-size:16px;color:var(--muted)}.wide{grid-column:span 3}.split{display:flex;justify-content:space-between;align-items:center}.muted,small{color:var(--muted)}.taskline{border-top:1px solid var(--line);padding:13px 0}.dot{width:10px;height:10px;background:#414966;border-radius:50%;display:inline-block;margin-right:10px}.dot.done{background:var(--mint)}.add{display:flex;gap:10px;margin-top:18px}.add input{flex:1}.field,.add input,.add select,input,textarea{background:#111529;border:1px solid #3a4262;border-radius:9px;color:var(--text);padding:11px}.add select{min-width:200px}.tasklist{display:grid;gap:9px;margin-top:16px}.task{display:flex;align-items:center;gap:13px;padding:14px}.check{border:1px solid #63709e;background:transparent;width:25px;height:25px;color:#111529;border-radius:50%;display:grid;place-items:center;flex-shrink:0}.check.checked{background:var(--mint);border-color:var(--mint)}.strike{text-decoration:line-through;color:#8992ad}.pill{color:#f5ad99;border:1px solid #805059;border-radius:20px;padding:2px 7px;font-size:10px;margin-left:8px}.delete{margin-left:auto;background:none;border:0;color:#8790af}.reflection{display:grid;gap:13px;max-width:850px}.reflection label{display:grid;gap:10px;font-weight:650}.reflection textarea{width:100%;min-height:100px;resize:vertical;font-weight:400}.score{width:150px}.carry{margin-bottom:18px}.carryrow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:10px 0}.carryrow span{margin-right:auto}.carryrow button{font-size:12px;padding:6px}.bars{height:175px;display:flex;gap:8px;align-items:end;padding-top:18px}.barwrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:6px}.bar{background:linear-gradient(var(--lav),#7b71d5);width:100%;border-radius:5px 5px 0 0;min-height:2px}.metric{display:grid;grid-template-columns:200px 1fr 60px;gap:10px;align-items:center;margin-top:17px;font-size:13px}.track{height:9px;background:#111529;border-radius:9px;overflow:hidden}.track i{display:block;height:100%;background:var(--mint)}.history{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line);padding:12px 0;color:#cbd2eb;font-size:14px}.tabs{display:flex;gap:5px;background:#111529;padding:4px;border-radius:9px}.tabs button.selected{background:#414966;color:#fff}.backup{display:flex;gap:7px;align-items:center}.backup button,.upload{background:#222840;color:#cbd2eb;border:1px solid #3b4362;border-radius:8px;padding:8px;font-size:11px}.upload{display:grid;place-items:center;cursor:pointer}.upload input{display:none}.toast{background:#24433d;color:#c5f6df;border-radius:9px;padding:10px;margin-bottom:12px}.empty{color:var(--muted);font-size:14px;padding:10px 0}.mobile-menu{display:none}.calendar-input{color:var(--muted);font-size:12px}.calendar-input input{padding:6px}.help{margin-top:8px;font-size:12px}
@media(max-width:800px){.sidebar{transform:translateX(-100%);transition:.2s;width:260px;box-shadow:10px 0 30px #0008}.sidebar.open{transform:none}.content{margin-left:0;padding:22px 18px 50px}.mobile-menu{display:block;background:none;border:0;color:white;margin-right:12px}header{justify-content:flex-start}.backup{margin-left:auto}.csv{display:none}.grid{grid-template-columns:1fr}.hero,.wide{grid-column:auto}.hero{padding:25px}.add{flex-wrap:wrap}.add input{min-width:100%}.add select{flex:1;min-width:0}.carryrow{flex-wrap:wrap}.carryrow span{width:100%}.metric{grid-template-columns:130px 1fr 40px}.history{grid-template-columns:1fr 1fr}.history span:last-child{display:none}}
</style>
</head>
<body><div id="app"></div>
<script>
(()=>{
'use strict';
const AREAS=['Academics / Learning','Personal Development','Career / Projects'];
const PROMPTS=[['A moment I’m proud of…','proud'],['What went well today?','well'],['A lesson I’m taking with me…','lesson'],['One gentle growth intention for tomorrow…','intention'],['Something I’m grateful for (optional)…','gratitude']];
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());
const blank=()=>({tasks:[],days:{},reviews:{weekly:{},monthly:{}}});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
const reviewKey=kind=>{if(kind==='monthly')return today().slice(0,7);const d=new Date(today()+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10)};
function safeData(x){if(!x||!Array.isArray(x.tasks)||!x.days||typeof x.days!=='object'||!x.reviews||typeof x.reviews!=='object')throw Error('Invalid backup');return {tasks:x.tasks.filter(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&typeof t.date==='string'&&AREAS.includes(t.area)).map(t=>({id:t.id,title:t.title.slice(0,140),date:t.date,area:t.area,done:!!t.done,priority:!!t.priority,archived:!!t.archived})),days:Object.fromEntries(Object.entries(x.days).filter(([d,v])=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&v&&typeof v==='object').map(([d,v])=>[d,{proud:String(v.proud||''),well:String(v.well||''),lesson:String(v.lesson||''),intention:String(v.intention||''),gratitude:String(v.gratitude||''),...(Number.isInteger(v.score)&&v.score>=0&&v.score<=100?{score:v.score}:{})}])),reviews:{weekly:x.reviews.weekly&&typeof x.reviews.weekly==='object'?x.reviews.weekly:{},monthly:x.reviews.monthly&&typeof x.reviews.monthly==='object'?x.reviews.monthly:{}}}}
let data;try{data=safeData(JSON.parse(localStorage.getItem('bright-planner-v1')))}catch{data=blank()}
let page='Dashboard',mobile=false,showCarry=true,notice='';
const save=()=>{try{localStorage.setItem('bright-planner-v1',JSON.stringify(data))}catch{notice='Browser storage is full. Export a JSON backup before continuing.'}};
const card=(content,cls='')=>`<section class="card ${cls}">${content}</section>`;
const empty=t=>`<p class="empty">✦ ${esc(t)}</p>`;
function header(){return `<header><button class="mobile-menu" data-action="menu" aria-label="Toggle navigation">☰</button><div><p class="eyebrow">${label(today())} · YOUR SPACE</p><h1>${esc(page)}</h1></div><div class="backup"><button data-action="json" title="Export JSON backup" aria-label="Export JSON backup">⇩</button><button class="csv" data-action="scorecsv">Scores CSV</button><button class="csv" data-action="taskcsv">Tasks CSV</button><label class="upload" title="Import JSON backup" aria-label="Import JSON backup">⇧<input type="file" accept="application/json" data-action="import"></label></div></header>`}
function shell(){const nav=['Dashboard','Daily Planner','Daily Reflection','Monitoring','Weekly & Monthly Reviews'];return `<aside class="sidebar ${mobile?'open':''}"><div class="brand"><span>✦</span> brighter days</div><p class="tagline">A kind place to make progress.</p><nav>${nav.map(n=>`<button data-page="${esc(n)}" class="${page===n?'active':''}">${n==='Dashboard'?'◫':n==='Daily Planner'?'☷':n==='Daily Reflection'?'♡':n==='Monitoring'?'⌁':'▦'} ${esc(n)}</button>`).join('')}</nav><div class="local">◉ <span>Stored on this device</span><small>Remember to back up regularly.</small></div></aside><main class="content">${header()}${notice?`<div class="toast">${esc(notice)}</div>`:''}${page==='Dashboard'?dashboard():page==='Daily Planner'?planner():page==='Daily Reflection'?reflection():page==='Monitoring'?monitoring():reviews()}</main>`}
function dashboard(){const date=today(),tasks=data.tasks.filter(t=>t.date===date&&!t.archived),old=data.tasks.filter(t=>t.date<date&&!t.done&&!t.archived),scores=Object.entries(data.days).filter(([,d])=>Number.isInteger(d.score)).sort(([a],[b])=>a.localeCompare(b)),done=tasks.filter(t=>t.done).length;let carry='';if(old.length&&showCarry)carry=`<section class="card carry"><h3>A gentle new-day check-in</h3><p class="muted">A few tasks are still open. Choose what feels right—nothing needs justification.</p>${old.map(t=>`<div class="carryrow"><span>${esc(t.title)}</span><button data-action="carry" data-id="${esc(t.id)}" data-to="today">Today</button><button data-action="carry" data-id="${esc(t.id)}" data-to="tomorrow">Tomorrow</button><button data-action="date" data-id="${esc(t.id)}">Choose date</button><button data-action="carry" data-id="${esc(t.id)}" data-to="leave">Leave behind</button></div>`).join('')}<button class="quiet" data-action="dismiss">Review later</button></section>`;return `${carry}<div class="grid">${card(`<p class="eyebrow">TODAY’S DASHBOARD</p><h2>Small, steady steps count.</h2><p>Choose what matters, then let the rest be enough.</p><button class="primary" data-page="Daily Planner">Plan my day ›</button>`,'hero')}${card(`<p class="muted">TODAY’S PROGRESS</p><strong class="big">${done}<span>/${tasks.length}</span></strong><p class="muted">tasks completed</p>`)}${card(`<p class="muted">MOST RECENT SCORE</p><strong class="big">${scores.at(-1)?.[1].score??'—'}<span>${scores.length?' / 100':''}</span></strong><p class="muted">self-assigned, always yours</p>`)}${card(`<div class="split"><div><h3>Your top priorities</h3><p class="muted">Focus gently on up to three things.</p></div><button class="quiet" data-page="Daily Planner">Open planner</button></div>${tasks.filter(t=>t.priority).slice(0,3).map(t=>`<div class="taskline"><span class="dot ${t.done?'done':''}"></span>${esc(t.title)}</div>`).join('')||empty('No priorities yet. Add what would make today feel meaningful.')}`,'wide')}</div>`}
function planner(){const tasks=data.tasks.filter(t=>t.date===today()&&!t.archived);return `<div class="planner">${card(`<h2>Make room for what matters</h2><p class="muted">Your first three tasks are marked as top priorities. Add as much or as little as helps.</p><div class="add"><input id="newtask" maxlength="140" placeholder="What would you like to do?" aria-label="New task"><select id="area">${AREAS.map(a=>`<option>${esc(a)}</option>`).join('')}</select><button class="primary" data-action="add">＋ Add</button></div>`)}<div class="tasklist">${tasks.length?tasks.map((t,i)=>card(`<button class="check ${t.done?'checked':''}" aria-label="Mark ${esc(t.title)} complete" data-action="toggle" data-id="${esc(t.id)}">${t.done?'✓':''}</button><div><div class="${t.done?'strike':''}">${esc(t.title)}${t.priority?`<span class="pill">Top ${i<3?'priority':''}</span>`:''}</div><small>${esc(t.area)}</small></div><button class="delete" aria-label="Remove ${esc(t.title)}" data-action="delete" data-id="${esc(t.id)}">×</button>`,'task')).join(''):card(empty('A clear page is a perfectly good place to begin. Add a task whenever you’re ready.'))}</div></div>`}
function reflection(){const day=data.days[today()]||{};return `<div class="reflection">${card(`<h2>End the day with kindness</h2><p class="muted">There’s no perfect answer—just notice what’s true for you.</p>`)}${PROMPTS.map(([label,key])=>card(`<label>${label}<textarea maxlength="1000" data-field="${key}" placeholder="Write a few words, if you’d like…">${esc(day[key]||'')}</textarea></label>`)).join('')}${card(`<label>Today’s score <span class="muted">(optional, 0–100)</span><input class="score field" data-field="score" type="number" min="0" max="100" step="1" value="${Number.isInteger(day.score)?day.score:''}" placeholder="—"></label><p class="muted">Your score is self-assigned and is never calculated from tasks.</p>`)}</div>`}
function monitoring(){const days=Object.entries(data.days).sort(([a],[b])=>a.localeCompare(b)),scores=days.filter(([,d])=>Number.isInteger(d.score)),avg=a=>a.length?Math.round(a.reduce((s,[,d])=>s+d.score,0)/a.length):null,week=scores.filter(([d])=>Date.now()-new Date(d+'T12:00:00')<7*86400000),month=scores.filter(([d])=>d.slice(0,7)===today().slice(0,7)),area=Object.fromEntries(AREAS.map(a=>[a,{all:0,done:0}]));data.tasks.forEach(t=>{if(area[t.area]){area[t.area].all++;if(t.done)area[t.area].done++}});return `<div class="grid">${card(`<p class="muted">LAST 7 DAYS</p><strong class="big">${avg(week)??'—'}</strong><p class="muted">average of scored days</p>`)}${card(`<p class="muted">THIS MONTH</p><strong class="big">${avg(month)??'—'}</strong><p class="muted">average of scored days</p>`)}${card(`<p class="muted">ALL-TIME AVERAGE</p><strong class="big">${avg(scores)??'—'}</strong><p class="muted">${scores.length} scored day${scores.length===1?'':'s'}</p>`)}${card(`<h3>Score trend</h3>${scores.length?`<div class="bars">${scores.slice(-14).map(([d,x])=>`<div class="barwrap"><div class="bar" style="height:${x.score}%" title="${label(d)}: ${x.score}"></div><small>${new Date(d+'T12:00:00').getDate()}</small></div>`).join('')}</div>`:empty('Scores appear here only when you choose to add them.')}`,'wide')}${card(`<h3>Category follow-through</h3>${AREAS.map(a=>`<div class="metric"><span>${esc(a)}</span><div class="track"><i style="width:${area[a].all?area[a].done/area[a].all*100:0}%"></i></div><small>${area[a].done}/${area[a].all}</small></div>`).join('')}`,'wide')}${card(`<h3>Recent history</h3>${days.slice(-10).reverse().map(([d,x])=>`<div class="history"><span>${label(d)}</span><span>${Number.isInteger(x.score)?x.score+'/100':'No score'}</span><span>${x.proud?'Reflection saved':'—'}</span></div>`).join('')||empty('Your reflections and scores will form a gentle record here.')}`,'wide')}</div>`}
function reviews(){const kind=window.reviewKind||'weekly',review=data.reviews[kind][reviewKey(kind)]||{};return `<div class="reflection">${card(`<div class="split"><div><h2>Pause and notice</h2><p class="muted">A private space for patterns, progress, and what you want next.</p></div><div class="tabs"><button class="${kind==='weekly'?'selected':''}" data-action="reviewkind" data-kind="weekly">Weekly</button><button class="${kind==='monthly'?'selected':''}" data-action="reviewkind" data-kind="monthly">Monthly</button></div></div>`)}${[['Wins worth celebrating','wins'],['Lessons I’m carrying forward','lessons'],['A gentle growth intention','intention'],['Anything else I want to remember','notes']].map(([l,k])=>card(`<label>${l}<textarea maxlength="2000" data-review="${k}" placeholder="Take your time…">${esc(review[k]||'')}</textarea></label>`)).join('')}</div>`}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csvCell(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function action(el){const act=el.dataset.action,id=el.dataset.id;if(act==='menu'){mobile=!mobile;render()}else if(act==='dismiss'){showCarry=false;render()}else if(act==='add'){const input=document.querySelector('#newtask'),title=input.value.trim();if(!title)return;const area=document.querySelector('#area').value;data.tasks.push({id:uid(),title,area,date:today(),done:false,priority:data.tasks.filter(t=>t.date===today()&&t.priority).length<3});save();render();document.querySelector('#newtask')?.focus()}else if(act==='toggle'){const t=data.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();render()}else if(act==='delete'){data.tasks=data.tasks.filter(t=>t.id!==id);save();render()}else if(act==='carry'){const t=data.tasks.find(x=>x.id===id);if(t){if(el.dataset.to==='leave')t.archived=true;else if(el.dataset.to==='tomorrow'){const d=new Date();d.setDate(d.getDate()+1);t.date=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}else t.date=today()}save();render()}else if(act==='date'){const t=data.tasks.find(x=>x.id===id),d=prompt('Move to date (YYYY-MM-DD)');if(t&&/^\d{4}-\d{2}-\d{2}$/.test(d||'')){t.date=d;save();render()}}else if(act==='json'){download('brighter-days-backup.json',JSON.stringify(data,null,2),'application/json')}else if(act==='scorecsv'){const rows=[['date','score'],...Object.entries(data.days).filter(([,d])=>Number.isInteger(d.score)).map(([d,x])=>[d,x.score])];download('daily-scores.csv',rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv')}else if(act==='taskcsv'){const rows=[['title','date','category','complete','archived'],...data.tasks.map(t=>[t.title,t.date,t.area,t.done,t.archived])];download('tasks.csv',rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv')}else if(act==='reviewkind'){window.reviewKind=el.dataset.kind;render()}}
function render(){document.querySelector('#app').innerHTML=shell()}
document.addEventListener('click',e=>{const pageButton=e.target.closest('[data-page]');if(pageButton){page=pageButton.dataset.page;mobile=false;render();return}const button=e.target.closest('[data-action]');if(button&&button.dataset.action!=='import')action(button)});
document.addEventListener('keydown',e=>{if(e.target.id==='newtask'&&e.key==='Enter'){e.preventDefault();action({dataset:{action:'add'}})}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.field){const d=data.days[today()]||(data.days[today()]={});if(el.dataset.field==='score'){if(el.value==='')delete d.score;else{const n=Number(el.value);if(Number.isInteger(n)&&n>=0&&n<=100)d.score=n}}else d[el.dataset.field]=el.value;save()}if(el.dataset.review){const kind=window.reviewKind||'weekly',key=reviewKey(kind);data.reviews[kind][key]??={};data.reviews[kind][key][el.dataset.review]=el.value;save()}});
document.addEventListener('change',e=>{if(e.target.dataset.action==='import'){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{data=safeData(JSON.parse(reader.result));save();notice='Backup imported safely.'}catch{notice='That file does not look like a planner backup.'}render()};reader.readAsText(file)}});
render();
})();
</script>
</body>
</html>
